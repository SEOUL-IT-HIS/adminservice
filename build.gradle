plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.seoulit.his.adminservice'
version = '0.0.1-SNAPSHOT'
description = 'adminservice'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // emp_role 등 일부 테이블은 JPA 연관관계 대신 MyBatis로 SQL을 직접 다룸 (학습 목적 병행 사용)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'
    // 비밀번호 PW_HASH용 (BCrypt). 전체 Security 필터 체인은 이후 auth 스토리에서 연동
    implementation 'org.springframework.security:spring-security-crypto'

    // 로그인 세션을 톰캣 메모리 대신 Redis 에 저장 (서비스 간 세션 공유)
    // 주의: Boot 3 에서 쓰던 spring-boot-starter-data-redis + spring-session-data-redis 조합은
    //      Boot 4 에서 자동설정 모듈이 빠져 조용히 무시된다. 이 스타터를 써야 한다.
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

    // OpenAPI 3 + Swagger UI (Spring Boot 4.x → springdoc 3.x)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
