spring.application.name=adminservice
server.port=8080

# HttpSession (서버 세션) — JWT 미사용
# - 타임아웃: 30분 (마지막 요청마다 연장 = 슬라이딩)
# - 쿠키 HttpOnly: JS 에서 document.cookie 로 읽지 못함
server.servlet.session.timeout=10h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax

# 세션 저장소 (Redis) — 서비스 간 로그인 공유
# - 지금까지는 세션이 톰캣 메모리에 있어서 서버를 껐다 켜면 로그인이 풀렸고,
#   다른 서비스(billing, patient ...)는 그 세션을 볼 수 없었다.
# - Redis 에 저장하면 재기동해도 유지되고, 같은 Redis 를 보는 서비스는 같은 로그인을 인식한다.
# - 2026-09-09 원격 서버(192.168.1.126)로 이전했다. 예전에는 담당자 개인 PC 에서 돌아서
#   그 PC 를 끄면 모두의 로그인이 끊겼다. 이제 Docker 로 상시 구동된다.
#   (redis:7-alpine, --appendonly yes 라서 컨테이너를 다시 띄워도 세션이 남는다)
#   10개 서비스가 모두 이 주소를 보면 그때부터 로그인이 실제로 공유된다.
# - 비밀번호는 이 파일에 적지 않는다. 이 파일은 GitHub 에 그대로 올라가기 때문이다.
#   대신 PC 의 환경변수 REDIS_PASSWORD 에 넣어두면 아래 자리에 채워진다.
#     setx REDIS_PASSWORD 비밀번호        → 새 터미널·IntelliJ 부터 적용
#   환경변수가 없으면 빈 값이 들어가서 Redis 인증에 실패한다. 그때는 위 명령을 다시 확인할 것.
spring.data.redis.host=192.168.1.126
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}


# SQLGate 연결정보와 동일 (seoulit.pe.kr / FREEPDB1 / admin)
spring.datasource.url=jdbc:oracle:thin:@seoulit.pe.kr:1521/FREEPDB1
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 기존 ADMIN 스키마(EMPLOYEE, ACCOUNT, MENU)에 맞춤. JPA는 검증만 수행
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.show-sql=true

# MSA service URLs (local LAN)
msa.admin-service.url=http://192.168.1.128:8080

# 서비스 간 호출용 공유 키 (IH2-111)
# - 다른 MSA 가 admin-service API 를 부를 때 X-Internal-Api-Key 헤더에 이 값을 담는다.
#   브라우저가 아니라 자바 프로세스가 거는 호출이라 로그인 세션이 없기 때문이다.
# - 팀 전체가 같은 값을 써야 한다. 값이 다르면 상대 서비스가 401 을 받는다.
# - 실제 운영에서는 이 파일에 두지 말고 환경변수로 분리할 것 (rrn.hash-secret 과 같은 이유)
msa.internal-api-key=his-msa-internal-2026

# MyBatis (emp_role 등 일부 테이블은 JPA 대신 SQL을 직접 관리 — 학습 목적 병행 사용)
# - mapper-locations: XML 매퍼 파일 위치
# - map-underscore-to-camel-case: DB 컬럼(EMP_ID) <-> 자바 필드(empId) 자동 변환
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# MyBatis가 실행하는 SQL을 콘솔에 찍어줌 (매퍼 인터페이스가 있는 패키지 기준)
logging.level.kr.co.seoulit.his.adminservice.emp.mybatis=DEBUG

# SeaweedFS S3 API (직원 프로필 사진 저장)
#
# 주소가 두 개인 이유:
# - endpoint        : 서버(admin-service)가 사진을 올리고 지울 때 쓰는 내부용 주소
# - public-base-url : 브라우저가 <img src> 로 사진을 받아올 때 쓰는 공개용 주소
#
# 지금은 둘이 같다. 브라우저가 8333 으로 직접 간다.
# 원격 서버 + Nginx 로 옮기면 보안상 8333 을 방화벽에서 막게 되는데, 그러면 브라우저가
# 직접 못 가서 사진이 전부 깨진다. 그때 public-base-url 만 아래처럼 바꾸면 된다.
#
#   seaweed.public-base-url=/files
#
# (Nginx 에 location /files/ { proxy_pass http://seaweedfs:8333/; } 가 함께 있어야 한다.
#  그리고 이미 등록된 사진들의 PROFILE_IMAGE_URL 은 옛 주소라 한 번 UPDATE 해줘야 한다)
#
# 안 적으면 endpoint 와 같은 값으로 채워진다.
#
# 2026-09-09 원격 서버(192.168.1.126)로 이전. 이전에는 담당자 개인 PC(192.168.1.128)에서
# 돌고 있어서 그 PC 를 끄면 전 팀의 사진이 깨졌다. 새 서버는 Docker 로 상시 구동된다.
# 기존 사진 13건은 파일 복사 + DB PROFILE_IMAGE_URL 일괄 UPDATE 로 함께 옮겼다.
seaweed.endpoint=http://192.168.1.126:8333
seaweed.public-base-url=
seaweed.bucket=emp-photo

# 주민등록번호 중복체크용 해시 비밀키 (HMAC-SHA256)
# - 이 값이 노출되면 해시 역추적 위험이 커지므로 실제 운영에서는 환경변수로 분리할 것
rrn.hash-secret=his-admin-emp-rrn-2026-change-me

